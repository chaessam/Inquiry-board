# main에 올리면 Cloudflare Pages(inquiry-board)에 자동 배포합니다.
# 필요한 GitHub 비밀값: CLOUDFLARE_API_TOKEN (Pages 편집 + D1 편집 권한)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 572a6f22c8ebc79605ca4d078ad742b4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 데이터베이스 표 바꾸기 (새 마이그레이션이 있을 때만 적용돼요)
        run: npx wrangler d1 migrations apply inquiry-board --remote
      - run: npm run build
      - name: Pages 배포
        run: npx wrangler pages deploy dist --project-name inquiry-board --branch main
